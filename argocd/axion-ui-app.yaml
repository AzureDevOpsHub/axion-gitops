
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: axion-ui
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AzureDevOpsHub/axion-gitops.git
    targetRevision: main
    path: apps/axion-ui
    helm:
      releaseName: axion-ui

  destination:
    server: https://kubernetes.default.svc
    namespace: axion

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
